<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yohnzz — Link in Bio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--c1:#a855f7;--c2:#06b6d4;--c3:#f43f5e;--sp:#1DB954}
body{font-family:'Poppins',sans-serif;min-height:100vh;overflow-x:hidden;background:#0a0a0f;color:#fff}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 50%,#1a0533 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#001a3a 0%,transparent 60%),radial-gradient(ellipse at 50% 100%,#1a0020 0%,transparent 60%),#070710}
.bg::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='1' fill='white' opacity='0.15'/%3E%3C/svg%3E") repeat;animation:starMove 60s linear infinite}
@keyframes starMove{to{background-position:600px 600px}}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.25;z-index:0;animation:orbFloat 10s ease-in-out infinite alternate}
.orb1{width:400px;height:400px;background:var(--c1);top:-100px;left:-100px;animation-delay:0s}
.orb2{width:300px;height:300px;background:var(--c2);bottom:-80px;right:-80px;animation-delay:-3s}
.orb3{width:250px;height:250px;background:var(--c3);top:50%;left:60%;animation-delay:-6s}
@keyframes orbFloat{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,30px) scale(1.1)}}
.wrap{position:relative;z-index:10;max-width:480px;margin:0 auto;padding:60px 16px 80px;display:flex;flex-direction:column;align-items:center;animation:fadeUp .8s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}

/* ===== TOP BAR: waktu saja ===== */
.top-bar{width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:fadeUp .5s ease both}
.clock-wrap{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:50px;padding:6px 14px;font-size:12px;font-weight:500;color:rgba(255,255,255,.7);backdrop-filter:blur(10px)}
.clock-dot{width:7px;height:7px;border-radius:50%;background:#1DB954;animation:dotPulse 1.5s ease-in-out infinite;flex-shrink:0}

/* ===== AVATAR & PROFILE ===== */
.avatar-ring{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));padding:3px;animation:ringPulse 3s ease-in-out infinite;margin-bottom:18px;flex-shrink:0}
@keyframes ringPulse{0%,100%{box-shadow:0 0 20px rgba(168,85,247,.4),0 0 40px rgba(6,182,212,.2)}50%{box-shadow:0 0 40px rgba(168,85,247,.7),0 0 80px rgba(6,182,212,.4)}}
.avatar-fallback{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#1e1030,#0a1a30);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--c1);text-shadow:0 0 20px var(--c1);letter-spacing:-2px}
/* ===== AVATAR CUSTOM IMAGE ===== */
.avatar-section{position:relative;margin-bottom:24px;flex-shrink:0}
.avatar-container{
  position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.avatar-logo{
  width:100%;height:100%;object-fit:cover;border-radius:50%;
  display:block;transition:opacity .4s ease;
}
.avatar-fallback{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:700;color:var(--c1);text-shadow:0 0 20px var(--c1);
  letter-spacing:-2px;background:linear-gradient(135deg,#1e1030,#0a1a30);
  transition:opacity .4s ease;
}
.avatar-logo.error{
  opacity:0;
}
.avatar-logo.error + .avatar-fallback{
  opacity:1;
}

/* Mobile */
@media(max-width:360px){
  .avatar-section{margin-bottom:20px}
  .avatar-fallback{font-size:32px}
}
.name{font-size:clamp(22px,6vw,28px);font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,#fff 0%,var(--c1) 50%,var(--c2) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;text-align:center}
.bio{font-size:clamp(12px,3.5vw,14px);color:rgba(255,255,255,.6);text-align:center;margin-bottom:10px;letter-spacing:.3px;padding:0 8px}

/* ===== STATUS BADGE ===== */
.status-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(29,185,84,.1);border:1px solid rgba(29,185,84,.25);border-radius:50px;padding:5px 14px;font-size:11px;font-weight:600;color:#1DB954;letter-spacing:.5px;margin-bottom:26px;cursor:default}
.status-dot{width:6px;height:6px;border-radius:50%;background:#1DB954;animation:dotPulse 1.2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* ===== SOCIALS ===== */
.socials{display:flex;gap:16px;margin-bottom:36px;flex-wrap:wrap;justify-content:center}
.soc-btn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);transition:transform .25s,box-shadow .25s,border-color .25s;position:relative;overflow:hidden;flex-shrink:0}
.soc-btn::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--hover-bg,rgba(255,255,255,.1));opacity:0;transition:opacity .25s}
.soc-btn:hover{transform:scale(1.2) translateY(-4px)}
.soc-btn:hover::before{opacity:1}
.soc-btn:hover .soc-icon{filter:drop-shadow(0 0 8px var(--glow-clr))}
.soc-btn[data-net="tiktok"]{--glow-clr:#69c9d0;--hover-bg:rgba(105,201,208,.15);color:#69c9d0}
.soc-btn[data-net="youtube"]{--glow-clr:#ff0000;--hover-bg:rgba(255,0,0,.15);color:#ff4d4d}
.soc-btn[data-net="instagram"]{--glow-clr:#e1306c;--hover-bg:rgba(225,48,108,.15);color:#e1306c}
.soc-btn:hover[data-net="tiktok"]{box-shadow:0 0 20px rgba(105,201,208,.4);border-color:#69c9d0}
.soc-btn:hover[data-net="youtube"]{box-shadow:0 0 20px rgba(255,77,77,.4);border-color:#ff4d4d}
.soc-btn:hover[data-net="instagram"]{box-shadow:0 0 20px rgba(225,48,108,.4);border-color:#e1306c}

/* ===== SPOTIFY ===== */
.sp-wrap{width:100%;margin-bottom:28px;animation:fadeUp .7s .2s ease both}
.sp-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:1.5px;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:12px;padding-left:4px}
.sp-label i{color:var(--sp);font-size:13px}
.sp-card{background:rgba(10,10,20,.65);border:1px solid rgba(29,185,84,.2);border-radius:20px;backdrop-filter:blur(20px);overflow:hidden;box-shadow:0 0 40px rgba(29,185,84,.08),inset 0 1px 0 rgba(255,255,255,.05);transition:box-shadow .4s}
.sp-card:hover{box-shadow:0 0 60px rgba(29,185,84,.15),inset 0 1px 0 rgba(255,255,255,.05)}
.sp-top{display:flex;align-items:center;gap:14px;padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.sp-art-wrap{position:relative;flex-shrink:0;width:54px;height:54px;border-radius:10px;overflow:hidden;transition:border-radius .4s}
.sp-art-wrap.playing{border-radius:50%;animation:artPulse 3s ease-in-out infinite}
@keyframes artPulse{0%,100%{box-shadow:0 0 0 0 rgba(29,185,84,.4)}50%{box-shadow:0 0 0 8px rgba(29,185,84,0)}}
.art-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .4s}
.sp-art-wrap.playing .art-inner{animation:artSpin 10s linear infinite}
@keyframes artSpin{to{transform:rotate(360deg)}}
.sp-info{flex:1;min-width:0;overflow:hidden}
.sp-track{font-size:clamp(13px,3.5vw,14px);font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-artist{font-size:clamp(11px,3vw,12px);color:rgba(255,255,255,.5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-badge{display:none;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--sp);background:rgba(29,185,84,.1);border:1px solid rgba(29,185,84,.25);border-radius:20px;padding:3px 9px;flex-shrink:0}
.sp-badge.show{display:flex}
.sp-dot{width:6px;height:6px;border-radius:50%;background:var(--sp);animation:dotPulse 1.2s ease-in-out infinite}
.sp-progress-wrap{padding:4px 18px 12px}
.sp-time{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.35);margin-bottom:6px}
.sp-bar-track{height:4px;background:rgba(255,255,255,.1);border-radius:10px;cursor:pointer;position:relative}
.sp-bar-fill{height:100%;background:linear-gradient(90deg,var(--sp),#5af078);border-radius:10px;width:0%;position:relative;transition:width .3s linear}
.sp-bar-fill::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#fff;opacity:0;transition:opacity .2s;box-shadow:0 0 8px rgba(29,185,84,.8)}
.sp-bar-track:hover .sp-bar-fill::after{opacity:1}
.sp-controls{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 12px;gap:8px}
.sp-ctrl-grp{display:flex;align-items:center;gap:6px}
.sp-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.07);color:rgba(255,255,255,.65);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .2s}
.sp-btn:hover{background:rgba(255,255,255,.15);color:#fff;transform:scale(1.1)}
.sp-btn:active{transform:scale(.93)}
.sp-btn.active{color:var(--sp);background:rgba(29,185,84,.12)}
.sp-play-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--sp);color:#000;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(29,185,84,.5);transition:transform .2s,box-shadow .2s}
.sp-play-btn:hover{transform:scale(1.12);box-shadow:0 0 35px rgba(29,185,84,.75)}
.sp-play-btn:active{transform:scale(.93)}
.sp-pl-header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 8px;cursor:pointer;border-top:1px solid rgba(255,255,255,.05);user-select:none}
.sp-pl-title{font-size:11px;font-weight:600;color:rgba(255,255,255,.4);letter-spacing:1px;text-transform:uppercase}
.sp-pl-chevron{font-size:11px;color:rgba(255,255,255,.3);transition:transform .35s}
.sp-pl-chevron.open{transform:rotate(180deg)}
.sp-playlist{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1)}
.sp-playlist.open{max-height:260px;overflow-y:auto}
.sp-playlist::-webkit-scrollbar{width:3px}
.sp-playlist::-webkit-scrollbar-thumb{background:rgba(29,185,84,.3);border-radius:10px}
.sp-track-item{display:flex;align-items:center;gap:12px;padding:8px 18px;cursor:pointer;transition:background .2s;background:none;border:none;width:100%;text-align:left;-webkit-tap-highlight-color:transparent}
.sp-track-item:hover{background:rgba(255,255,255,.05)}
.sp-track-item.active{background:rgba(29,185,84,.08)}
.sp-ti-num{font-size:11px;color:rgba(255,255,255,.3);width:18px;text-align:center;flex-shrink:0}
.sp-track-item.active .sp-ti-num{color:var(--sp)}
.sp-ti-emoji{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sp-ti-info{flex:1;min-width:0;overflow:hidden}
.sp-ti-name{font-size:13px;font-weight:500;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-track-item.active .sp-ti-name{color:var(--sp)}
.sp-ti-artist{font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-ti-dur{font-size:11px;color:rgba(255,255,255,.3);flex-shrink:0}
.sp-eq{display:flex;align-items:flex-end;gap:2px;height:14px;flex-shrink:0}
.sp-eq span{width:3px;background:var(--sp);border-radius:2px}
.sp-eq span:nth-child(1){animation:eq1 .4s ease-in-out infinite alternate}
.sp-eq span:nth-child(2){animation:eq2 .6s ease-in-out infinite alternate}
.sp-eq span:nth-child(3){animation:eq3 .5s ease-in-out infinite alternate}
.sp-eq span:nth-child(4){animation:eq4 .7s ease-in-out infinite alternate}
@keyframes eq1{0%{height:6px}100%{height:3px}}
@keyframes eq2{0%{height:12px}100%{height:4px}}
@keyframes eq3{0%{height:14px}100%{height:5px}}
@keyframes eq4{0%{height:8px}100%{height:3px}}
.sp-open-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 18px 18px;padding:11px 18px;border-radius:50px;background:rgba(29,185,84,.1);border:1px solid rgba(29,185,84,.3);color:var(--sp);font-size:13px;font-weight:600;text-decoration:none;transition:background .2s,box-shadow .2s,transform .2s;font-family:inherit;cursor:pointer}
.sp-open-btn:hover{background:rgba(29,185,84,.2);box-shadow:0 0 24px rgba(29,185,84,.25);transform:translateY(-2px)}

/* ===== LINK BUTTONS ===== */
.links{width:100%;display:flex;flex-direction:column;gap:14px}
.link-btn{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:50px;text-decoration:none;font-size:clamp(13px,3.5vw,15px);font-weight:600;color:#fff;position:relative;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.link-btn::before{content:'';position:absolute;inset:0;border-radius:50px;background:var(--btn-grad);opacity:0;transition:opacity .3s;z-index:0}
.link-btn:hover{transform:translateY(-4px)}
.link-btn:hover::before{opacity:.15}
.link-btn:hover{box-shadow:0 8px 30px var(--btn-shadow,rgba(255,255,255,.1));border-color:var(--btn-border)}
.link-btn:active{transform:scale(.97)}
/* Update CSS ini di bagian LINK BUTTONS */
.link-btn[data-id="donate"]{
  --btn-grad:linear-gradient(90deg,#ff6b9d,#f97316,#ef4444);
  --btn-shadow:rgba(244,63,94,.4);
  --btn-border:rgba(249,115,22,.6)
}
.link-btn[data-id="donate"]:hover{
  box-shadow:0 8px 30px rgba(255,107,157,.6);
  border-color:#f97316
}
.link-btn[data-id="donate"] .btn-icon{
  --btn-grad:linear-gradient(135deg,#ff6b9d,#f97316);
  box-shadow:0 0 12px rgba(244,63,94,.7)
}
.link-btn[data-id="donate"]:hover .btn-icon{
  box-shadow:0 0 20px rgba(255,107,157,.9);
  transform:scale(1.05);
  animation:pulseHeart .6s ease-in-out
}

.link-btn[data-id="discord"]{
  --btn-grad:linear-gradient(90deg,#5865f2,#7289da);
  --btn-shadow:rgba(88,101,242,.4);
  --btn-border:rgba(114,137,218,.6)
}
.link-btn[data-id="discord"]:hover{
  box-shadow:0 8px 30px rgba(88,101,242,.5);
  border-color:#7289da
}
.link-btn[data-id="discord"] .btn-icon{
  --btn-grad:linear-gradient(135deg,#5865f2,#7289da);
  box-shadow:0 0 12px rgba(88,101,242,.6)
}
.link-btn[data-id="discord"]:hover .btn-icon{
  box-shadow:0 0 20px rgba(88,101,242,.8);
  transform:scale(1.05)
}

@keyframes pulseHeart{
  0%,100%{transform:scale(1.05)}
  50%{transform:scale(1.15)}
}
.link-btn[data-id="project"]{--btn-grad:linear-gradient(90deg,#22d3ee,#22c55e);--btn-shadow:rgba(34,211,238,.3);--btn-border:rgba(34,197,94,.5)}
.btn-icon{width:38px;height:38px;border-radius:50%;background:var(--btn-grad);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;position:relative;z-index:1;box-shadow:0 0 12px var(--btn-shadow)}
.btn-label{position:relative;z-index:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-arrow{position:relative;z-index:1;font-size:14px;color:rgba(255,255,255,.4);transition:color .3s,transform .3s;flex-shrink:0}
.link-btn:hover .btn-arrow{color:rgba(255,255,255,.8);transform:translateX(4px)}

/* ===== SHARE BUTTON ===== */
.share-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 18px;border-radius:50px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .25s;margin-top:6px;backdrop-filter:blur(10px)}
.share-btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25);transform:translateY(-2px)}
.share-btn i{font-size:14px}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(20,20,35,.95);border:1px solid rgba(255,255,255,.15);border-radius:50px;padding:10px 22px;font-size:13px;font-weight:600;color:#fff;backdrop-filter:blur(20px);z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== CONFETTI ===== */
.confetti-piece{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:9998;animation:confettiFall 1.2s ease-in forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(300px) rotate(720deg)}}

/* ===== FOOTER ===== */
.footer{margin-top:44px;font-size:12px;color:rgba(255,255,255,.25);text-align:center;letter-spacing:.5px}

/* ===== ANIMATIONS ===== */
.links .link-btn:nth-child(1){animation:fadeUp .6s .3s ease both}
.links .link-btn:nth-child(2){animation:fadeUp .6s .45s ease both}
.links .link-btn:nth-child(3){animation:fadeUp .6s .6s ease both}
.links .link-btn:nth-child(4){animation:fadeUp .6s .75s ease both}
.socials .soc-btn{animation:fadeUp .6s ease both}
.socials .soc-btn:nth-child(1){animation-delay:.15s}
.socials .soc-btn:nth-child(2){animation-delay:.25s}
.socials .soc-btn:nth-child(3){animation-delay:.35s}

@media(max-width:480px){
  .wrap{padding:40px 12px 60px}
  .sp-top{gap:10px;padding:14px 14px 12px}
  .sp-controls{padding:8px 12px 12px}
  .sp-progress-wrap{padding:4px 14px 10px}
  .sp-pl-header{padding:10px 14px 8px}
  .sp-track-item{padding:8px 14px}
  .sp-open-btn{margin:8px 14px 14px}
  .link-btn{padding:12px 14px;gap:10px}
  .btn-icon{width:34px;height:34px;font-size:14px}
  .sp-badge{display:none!important}
}
@media(max-width:360px){
  .avatar-ring{width:90px;height:90px}
  .avatar-fallback{font-size:32px}
  .sp-art-wrap{width:44px;height:44px}
  .art-inner{font-size:20px}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="toast" id="toast"></div>

<main class="wrap">

  <!-- TOP BAR: Jam -->
  <div class="top-bar">
    <div class="clock-wrap">
      <span class="clock-dot"></span>
      <span id="clockDisplay">00:00:00</span>
      <span style="color:rgba(255,255,255,.35);font-size:10px;margin-left:2px">WIB</span>
    </div>
  </div>

 <!-- Avatar dengan Custom Image -->
<!-- Avatar dengan Custom Image -->
<div class="avatar-section">
  <div class="avatar-ring">
    <div class="avatar-container">
      
      <!-- FIXED IMAGE -->
      <img 
        src="asset/gambar.png" 
        alt="Yohnzz" 
        class="avatar-logo"
        onerror="this.style.display='none'; this.nextElementSibling.style.opacity='1';"
      >

      <!-- Fallback -->
      <div class="avatar-fallback">YZ</div>

    </div>
  </div>
</div>
<h1 class="name">Yohnzz</h1>

  <!-- Online Status Badge -->
  <div class="status-badge">
    <span class="status-dot"></span>
    Online & Active
  </div>

  <!-- Socials -->
  <div class="socials">
    <a href="https://www.tiktok.com/@arh4nn_y" class="soc-btn" data-net="tiktok" aria-label="TikTok" title="TikTok"><i class="fa-brands fa-tiktok soc-icon"></i></a>

<script>
  /* Avatar image fallback */
window.addEventListener('load', function(){
  const img = document.querySelector('.avatar-logo');
  const fallback = document.querySelector('.avatar-fallback');
  
  img.onerror = function(){
    this.classList.add('error');
    fallback.style.opacity = '1';
  };
  
  // Preload check
  if(img.complete && img.naturalWidth === 0){
    img.classList.add('error');
  }
});
/* =========================================================
   VIEW COUNTER — FIXED VERSION (KERJA DI SEMUA DEVICE)
   ========================================================= */
(function trackViews(){
  const KEY_TOTAL   = 'yz_views_total';
  const KEY_VISITS  = 'yz_visit_count';
  const KEY_LAST_VISIT = 'yz_last_visit';
  const KEY_SESSION_START = 'yz_session_start_' + btoa(window.location.href); // Unique per page
  const SESSION_TIMEOUT = 30 * 60 * 1000; // 30 menit timeout
  
  const now = Date.now();
  let total = parseInt(localStorage.getItem(KEY_TOTAL) || '0');
  let visits = parseInt(localStorage.getItem(KEY_VISITS) || '0');
  
  // Cek apakah ini visit baru (timeout 30 menit)
  const lastVisit = parseInt(localStorage.getItem(KEY_LAST_VISIT) || '0');
  const isNewVisit = (now - lastVisit) > SESSION_TIMEOUT;
  
  if(isNewVisit) {
    // New session → count as visit
    visits++;
    localStorage.setItem(KEY_VISITS, visits.toString());
    localStorage.setItem(KEY_LAST_VISIT, now.toString());
  }
  
  // Selalu count view (setiap load halaman)
  total++;
  localStorage.setItem(KEY_TOTAL, total.toString());
  
  // Update daily views
  const today = new Date().toISOString().slice(0,10);
  const todayKey = 'yz_views_today_' + today;
  const todayViews = parseInt(localStorage.getItem(todayKey) || '0') + 1;
  localStorage.setItem(todayKey, todayViews.toString());
  
  // Simpan tanggal terakhir
  localStorage.setItem('yz_views_date', today);
  
})();

/* =========================================================
   LIVE CLOCK — WIB (UTC+7)
   ========================================================= */
function updateClock(){
  const now = new Date();
  const wib = new Date(now.getTime() + 7*3600*1000);
  const h = String(wib.getUTCHours()).padStart(2,'0');
  const m = String(wib.getUTCMinutes()).padStart(2,'0');
  const s = String(wib.getUTCSeconds()).padStart(2,'0');
  const el = document.getElementById('clockDisplay');
  if(el) el.textContent = h+':'+m+':'+s;
}
updateClock();
setInterval(updateClock, 1000);

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer;
function showToast(msg, icon=''){
  const t = document.getElementById('toast');
  t.textContent = (icon?icon+' ':'')+msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* =========================================================
   CONFETTI
   ========================================================= */
function spawnConfetti(x, y){
  const colors = ['#a855f7','#06b6d4','#f43f5e','#1DB954','#f59e0b','#ffffff'];
  for(let i=0;i<28;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `left:${x+(Math.random()-.5)*120}px;top:${y-20}px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;transform:rotate(${Math.random()*360}deg);animation-duration:${.8+Math.random()*.8}s;animation-delay:${Math.random()*.3}s;border-radius:${Math.random()>.5?'50%':'2px'};`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1600);
  }
}
function handleDonate(e){
  const rect = e.currentTarget.getBoundingClientRect();
  spawnConfetti(rect.left+rect.width/2, rect.top);
  showToast('Makasih banyak! 💖 Kamu luar biasa!');
}

function shareProfile(){
  const url  = window.location.href;
  const text = 'Cek biolink Yohnzz! 🎮🔥';
  if(navigator.share){ navigator.share({title:'Yohnzz',text,url}).catch(()=>{}); }
  else { navigator.clipboard.writeText(url).then(()=>{ showToast('Link disalin ke clipboard!','📋'); }).catch(()=>showToast('Salin link: '+url)); }
}

/* =========================================================
   SPOTIFY PLAYER
   ========================================================= */
const audio = new Audio();
const TRACKS = [
  { name:'Nina', artist:'.Feast', src:'asset/music/Nina.mp3', emoji:'🎧', color:'#a855f7,#06b6d4' },
  { name:'Ada Titik-Titik Di Ujung Doa', artist:'Sal Priadi', src:'asset/music/Doa.mp3', emoji:'🙏', color:'#10b981,#3b82f6' },
  { name:'Komang', artist:'Raim Laode', src:'asset/music/Komang.mp3', emoji:'🌅', color:'#f59e0b,#ef4444' },
  { name:'Sesuatu Di Jogja', artist:'Adhitia Sofyan', src:'asset/music/Sesuatu.mp3', emoji:'☕', color:'#78350f,#d97706' }
];
let curIdx=0,playing=false,shuffled=false,repeat=false,plOpen=false;
const fmt = s=>{s=Math.floor(s||0);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function loadTrack(idx){
  curIdx=idx;const t=TRACKS[idx];
  audio.src=t.src;audio.load();
  document.getElementById('trackName').textContent=t.name;
  document.getElementById('trackArtist').textContent=t.artist;
  const ae=document.getElementById('artEmoji');ae.textContent=t.emoji;
  ae.style.background=`linear-gradient(135deg,${t.color})`;
  document.getElementById('artWrap').style.background=`linear-gradient(135deg,${t.color})`;
  document.getElementById('timeCur').textContent='0:00';
  document.getElementById('barFill').style.width='0%';
  buildPL();
}
audio.addEventListener('loadedmetadata',()=>{document.getElementById('timeTot').textContent=fmt(audio.duration);buildPL();});
audio.addEventListener('timeupdate',()=>{
  document.getElementById('timeCur').textContent=fmt(audio.currentTime);
  if(audio.duration)document.getElementById('barFill').style.width=(audio.currentTime/audio.duration*100)+'%';
});
audio.addEventListener('ended',()=>{if(repeat){audio.currentTime=0;audio.play();}else{nextTrack();}});
function setPlayState(p){playing=p;document.getElementById('playIcon').className=p?'fa-solid fa-pause':'fa-solid fa-play';document.getElementById('spBadge').classList.toggle('show',p);document.getElementById('artWrap').classList.toggle('playing',p);buildPL();}
function togglePlay(){if(playing){audio.pause();setPlayState(false);}else{audio.play().catch(()=>{});setPlayState(true);}}
function selectTrack(idx){loadTrack(idx);audio.play().catch(()=>{});setPlayState(true);}
function nextTrack(){const n=shuffled?Math.floor(Math.random()*TRACKS.length):(curIdx+1)%TRACKS.length;selectTrack(n);}
function prevTrack(){selectTrack((curIdx-1+TRACKS.length)%TRACKS.length);}
function toggleShuffle(){shuffled=!shuffled;document.getElementById('shuffleBtn').classList.toggle('active',shuffled);}
function toggleRepeat(){repeat=!repeat;document.getElementById('repeatBtn').classList.toggle('active',repeat);}
function buildPL(){
  const pl=document.getElementById('spPlaylist');
  document.getElementById('plCount').textContent=TRACKS.length;
  pl.innerHTML=TRACKS.map((t,i)=>{
    const isActive=i===curIdx;
    const numCell=isActive&&playing?'<div class="sp-eq"><span></span><span></span><span></span><span></span></div>':String(i+1);
    return`<button type="button" class="sp-track-item${isActive?' active':''}" onclick="selectTrack(${i})" aria-label="Putar ${t.name}" role="listitem">
      <div class="sp-ti-num">${numCell}</div>
      <div class="sp-ti-emoji" style="background:linear-gradient(135deg,${t.color})">${t.emoji}</div>
      <div class="sp-ti-info"><div class="sp-ti-name">${t.name}</div><div class="sp-ti-artist">${t.artist}</div></div>
      <div class="sp-ti-dur">${fmt(audio.duration)}</div>
    </button>`;
  }).join('');
}
document.getElementById('barTrack').addEventListener('click',function(e){
  e.preventDefault();const r=this.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/this.offsetWidth));
  if(audio.duration)audio.currentTime=p*audio.duration;
});
function togglePlaylist(){plOpen=!plOpen;document.getElementById('spPlaylist').classList.toggle('open',plOpen);document.getElementById('plChevron').classList.toggle('open',plOpen);}
document.querySelector('.sp-pl-header').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();togglePlaylist();}});
loadTrack(0);
</script>
